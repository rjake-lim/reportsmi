
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROTECTED TEXT</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #eaf0fc;
    font-family: Arial, sans-serif;
}

/* HEADER */
.header {
    height: 59px;
    background: #064477;
    border-top: 20px solid #393939;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    gap: 10px;
}

.logo {
    color: #b8c9df;
    font-family: Georgia, serif;
    font-size: 23px;
    letter-spacing: 1px;
    white-space: nowrap;
}

.logo strong {
    color: #e4eaf3;
    font-family: Arial, sans-serif;
    font-size: 20px;
    letter-spacing: -1px;
}

.actions {
    display: flex;
    align-items: center;
    gap: 5px;
}

.actions button {
    background: #e9edf5;
    color: #064477;
    border: 1px solid #8c9eaf;
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

.actions button:hover {
    background: #cbdcf0;
}

.actions .save {
    background: #527a9d;
    color: white;
}

.app-icon {
    border: 2px solid white;
    background: #eaf0fc;
    color: #064477;
    border-radius: 6px;
    padding: 5px;
    font-size: 11px;
    font-weight: bold;
    margin-right: 4px;
}

.fight {
    background: #063c72 !important;
    border: 2px solid #f5da00 !important;
    color: yellow !important;
    font-size: 10px !important;
    line-height: 10px;
    padding: 4px !important;
}

/* DOCUMENT TABS */
.tabs {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 8px 12px 0;
    overflow-x: auto;
}

.tab {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 23px;
    min-width: 102px;
    max-width: 220px;
    padding: 0 10px;
    background: #e0e8f5;
    border: 1px solid #aab8ca;
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    color: #063f77;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
}

.tab.active {
    background: white;
    height: 24px;
}

.tab-name {
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
}

.close-tab {
    color: #16436f;
    font-size: 13px;
    cursor: pointer;
}

.add-tab {
    width: 20px;
    height: 20px;
    border: 1px solid #aab8ca;
    border-radius: 4px;
    background: #e7edf6;
    color: #064477;
    cursor: pointer;
}

/* EDITOR */
.editor-container {
    padding: 0 12px;
}

#editor {
    display: block;
    width: 100%;
    height: calc(100vh - 91px);
    min-height: 400px;
    resize: none;
    border: 1px solid #aaa;
    border-radius: 0 0 3px 3px;
    background: white;
    padding: 8px 4px;
    color: #111;
    font-family: "Courier New", monospace;
    font-size: 13px;
    line-height: 16px;
    outline: none;
    white-space: pre-wrap;
    overflow: auto;
}

/* MOBILE */
@media (max-width: 650px) {
    .header {
        height: auto;
        min-height: 59px;
        flex-wrap: wrap;
        padding: 7px;
    }

    .logo {
        font-size: 18px;
    }

    .logo strong {
        font-size: 17px;
    }

    .actions {
        flex-wrap: wrap;
    }

    .actions button {
        padding: 5px 7px;
        font-size: 10px;
    }

    .tabs {
        padding-left: 7px;
    }

    .editor-container {
        padding: 0 7px;
    }

    #editor {
        height: calc(100dvh - 130px);
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">

    <div class="logo">
        PROTECTED<strong>TEXT</strong>
    </div>

    <div class="actions">

        <div class="app-icon">APP</div>

        <button class="fight"
            onclick="alert('WHY WE FIGHT')">
            WHY WE<br>FIGHT ✊
        </button>

        <button onclick="reloadDocument()">Reload</button>

        <button class="save" onclick="saveDocument()">
            Save
        </button>

        <button onclick="changePassword()">
            Change password
        </button>

        <button onclick="deleteDocument()">
            Delete
        </button>

    </div>

</header>

<!-- DOCUMENT TABS -->
<nav class="tabs" id="tabs">

    <button class="add-tab" onclick="addDocument()">+</button>

</nav>

<!-- TEXT EDITOR -->
<main class="editor-container">

    <textarea
        id="editor"
        spellcheck="false"
        placeholder="Start typing your document..."
    ></textarea>

</main>

<script>

/* DOCUMENT DATA */
let documents = JSON.parse(
    localStorage.getItem("protectedDocuments")
) || [
    {
        id: 1,
        name: "11/02/2026",
        content: `11/02/2026
MI Zamora update as of today.

Target Sales for November
Official TSLE: 198,312
Official TC: 573
Official AC: 346

TSLE: 127,125.89
TC: 313
AC: 380.63

MTD ADS: 128,164.70
MTD ADTC: 346
MTD AC: 370.42

DINE In: 63,025.12
TC: 188

TAKE OUT SALES: 17,545.47
TC: 63

FOOD PANDA Sales: 14,020.54
TC: 38

Call &pick up: 372.32
TC: 1

GRAB FOOD: 6,481.25
TC: 17

GRAB PICK-UP: 0.00
TC: 0

FP Pick up: 0.00
TC: 0

PWA pick up: 0.00
TC: 0

FAS: sales decreased by 35.90% vs target.

ADTC: TC decreased by 45.38% vs target due to less walk-in customers.

AC: Increased by 5% with the continous ss of vm, ISCD and new tsoko halo.

Thank you
Raulf`
    },
    {
        id: 2,
        name: "November 2, 2026",
        content: "November 2, 2026\n\n"
    },
    {
        id: 3,
        name: "Date: November 2, ...",
        content: "Date: November 2, 2026\n\n"
    }
];

let activeDocument = documents[0].id;

/* SAVE ALL DOCUMENTS */
function persistDocuments() {
    localStorage.setItem(
        "protectedDocuments",
        JSON.stringify(documents)
    );
}

/* RENDER TABS */
function renderTabs() {

    const tabs = document.getElementById("tabs");

    tabs.innerHTML = "";

    documents.forEach(doc => {

        const tab = document.createElement("div");

        tab.className = "tab" +
            (doc.id === activeDocument ? " active" : "");

        const name = document.createElement("span");
        name.className = "tab-name";
        name.textContent = doc.name;

        const close = document.createElement("span");
        close.className = "close-tab";
        close.textContent = "×";

        close.onclick = (event) => {
            event.stopPropagation();
            closeDocument(doc.id);
        };

        tab.appendChild(name);
        tab.appendChild(close);

        tab.onclick = () => switchDocument(doc.id);

        tabs.appendChild(tab);

    });

    const add = document.createElement("button");

    add.className = "add-tab";
    add.textContent = "+";
    add.onclick = addDocument;

    tabs.appendChild(add);
}

/* SWITCH DOCUMENT */
function switchDocument(id) {

    saveCurrentContent();

    activeDocument = id;

    const doc = documents.find(d => d.id === id);

    document.getElementById("editor").value =
        doc ? doc.content : "";

    renderTabs();
}

/* SAVE CURRENT CONTENT */
function saveCurrentContent() {

    const doc = documents.find(
        d => d.id === activeDocument
    );

    if (doc) {
        doc.content = document.getElementById("editor").value;
    }

}

/* SAVE BUTTON */
function saveDocument() {

    saveCurrentContent();
    persistDocuments();

    alert("Document saved successfully!");
}

/* RELOAD BUTTON */
function reloadDocument() {

    if (confirm("Reload this document? Unsaved changes will be lost.")) {

        const saved = JSON.parse(
            localStorage.getItem("protectedDocuments")
        ) || documents;

        documents = saved;

        const doc = documents.find(
            d => d.id === activeDocument
        );

        if (!doc && documents.length) {
            activeDocument = documents[0].id;
        }

        const current = documents.find(
            d => d.id === activeDocument
        );

        document.getElementById("editor").value =
            current ? current.content : "";

        renderTabs();
    }
}

/* ADD NEW DOCUMENT */
function addDocument() {

    saveCurrentContent();

    const newId = Date.now();

    const newDoc = {
        id: newId,
        name: "New Document",
        content: ""
    };

    documents.push(newDoc);

    activeDocument = newId;

    persistDocuments();

    document.getElementById("editor").value = "";

    renderTabs();
}

/* CLOSE DOCUMENT */
function closeDocument(id) {

    if (!confirm("Close this document?")) return;

    documents = documents.filter(doc => doc.id !== id);

    if (documents.length === 0) {
        addDocument();
        return;
    }

    if (activeDocument === id) {
        activeDocument = documents[0].id;
    }

    const current = documents.find(
        doc => doc.id === activeDocument
    );

    document.getElementById("editor").value =
        current.content;

    persistDocuments();
    renderTabs();
}

/* DELETE DOCUMENT */
function deleteDocument() {

    if (!confirm("Permanently delete this document?")) return;

    documents = documents.filter(
        doc => doc.id !== activeDocument
    );

    if (documents.length === 0) {
        addDocument();
        return;
    }

    activeDocument = documents[0].id;

    document.getElementById("editor").value =
        documents[0].content;

    persistDocuments();
    renderTabs();
}

/* CHANGE PASSWORD - DEMO */
function changePassword() {

    const password = prompt("Enter new password:");

    if (password) {
        alert("Password setting requires server-side authentication.");
    }
}

/* AUTO SAVE CONTENT TO MEMORY */
document.getElementById("editor").addEventListener(
    "input",
    saveCurrentContent
);

/* INITIALIZE */
const initial = documents.find(
    doc => doc.id === activeDocument
);

document.getElementById("editor").value =
    initial ? initial.content : "";

renderTabs();

</script>

</body>
</html>
