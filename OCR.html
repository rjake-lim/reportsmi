<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>POS Report To Excel</title>

<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

body{
    font-family:Calibri,Arial,sans-serif;
    background:#f5f5f5;
    padding:20px;
}

.container{
    background:white;
    max-width:1400px;
    margin:auto;
    padding:20px;
    border-radius:10px;
}

button{
    background:#217346;
    color:white;
    border:none;
    padding:10px 16px;
    cursor:pointer;
    margin-right:5px;
}

#status{
    margin-top:10px;
    font-weight:bold;
}

#preview{
    max-width:600px;
    margin-top:15px;
    border:1px solid #ccc;
    display:none;
}

table{
    border-collapse:collapse;
    margin-top:20px;
    width:100%;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
}

th{
    background:#217346;
    color:white;
}

td:nth-child(2),
td:nth-child(3){
    text-align:right;
}

textarea{
    width:100%;
    height:150px;
    margin-top:15px;
}

</style>
</head>
<body>

<div class="container">

<h2>POS Report OCR Extractor</h2>

<input type="file" id="imageInput" accept="image/*">

<button onclick="extractReport()">
Extract Report
</button>

<button onclick="downloadExcel()">
Download Excel
</button>

<div id="status"></div>

<img id="preview">

<textarea id="ocrText"></textarea>

<div id="tableContainer"></div>

</div>

<script>

let reportData = [];

document.getElementById("imageInput")
.addEventListener("change",function(e){

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload=function(event){

        const img =
            document.getElementById("preview");

        img.src = event.target.result;
        img.style.display="block";
    };

    reader.readAsDataURL(file);

});

async function extractReport(){

    const file =
        document.getElementById("imageInput")
        .files[0];

    if(!file){

        alert("Select image first");
        return;
    }

    document.getElementById("status")
    .innerHTML = "Running OCR...";

    const result =
        await Tesseract.recognize(
            file,
            "eng",
            {
                logger:m=>{

                    if(m.progress){

                        document.getElementById(
                            "status"
                        ).innerHTML =
                        m.status +
                        " " +
                        Math.round(
                            m.progress*100
                        ) + "%";
                    }
                }
            }
        );

    const text =
        result.data.text;

    document.getElementById(
        "ocrText"
    ).value = text;

    parseReport(text);

    document.getElementById(
        "status"
    ).innerHTML =
    "Completed";
}

function parseReport(text){

    reportData = [];

    const lines =
        text.split("\n");

    reportData.push([
        "Description",
        "Qty",
        "Amount"
    ]);

    lines.forEach(line=>{

        line = line.trim();

        if(!line) return;

        if(line.includes("CONTROL TOTAL"))
            return;

        if(line.includes("Qty"))
            return;

        if(line.includes("Amount"))
            return;

        if(line.includes("------"))
            return;

        const regex =
        /^(.*?)\s+(\d+)\s+([\d,]+\.\d{2})$/;

        const match =
            line.match(regex);

        if(match){

            reportData.push([
                match[1].trim(),
                match[2],
                match[3]
            ]);
        }

    });

    renderTable();
}

function renderTable(){

    let html =
    `<table>
        <thead>
            <tr>
                <th>Description</th>
                <th>Qty</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody>`;

    reportData.slice(1)
    .forEach(row=>{

        html += `
        <tr>
            <td contenteditable="true">
                ${row[0]}
            </td>
            <td contenteditable="true">
                ${row[1]}
            </td>
            <td contenteditable="true">
                ${row[2]}
            </td>
        </tr>`;
    });

    html += `
        </tbody>
    </table>`;

    document.getElementById(
        "tableContainer"
    ).innerHTML = html;
}

function downloadExcel(){

    if(reportData.length<=1){

        alert("No data found");
        return;
    }

    const ws =
        XLSX.utils.aoa_to_sheet(
            reportData
        );

    const wb =
        XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        wb,
        ws,
        "Report"
    );

    XLSX.writeFile(
        wb,
        "POS_Report.xlsx"
    );
}

</script>

</body>
</html>
